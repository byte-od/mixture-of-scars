[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mixture-of-scars"
version = "5.0.0"
description = "Mixture of Scars (MoS) v5.0, Pure Scar-Native Foundation Engine, SCache O(1) & ScarCodec: Tabula-Rasa D4-Lattice VQ4-STE Pretraining, End-to-End O(1) Widrow-Hoff Fast-Weights, 100% Detached Language-Nullspace Cartridges, 22-Shader WebGPU WGSL 1.0 & Physical Signal/Telemetry/CFD Operators"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Julio Cesar Reis Filho" }
]
keywords = [
    "llm",
    "kv-cache",
    "mixture-of-experts",
    "moe",
    "mixture-of-scars",
    "transformers",
    "fast-weights",
    "hebbian-learning",
    "pytorch",
    "huggingface"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.22.0",
    "safetensors>=0.4.0",
    "transformers>=4.45.0",
]

[project.scripts]
mos-run = "scar_cache.cli_72b:main"
mos-transcode-sub2bit = "scar_cache.sub2bit_mos:main_cli"
mos-graft = "scar_cache.scar_grafting:main_cli"
mos-store = "scar_cache.cli_scar_store:main"
mos-rebasin = "scar_cache.sinkhorn_rebasin:main_cli"
mos-webgpu = "scar_cache.webgpu_engine:main_cli"
mos-scar-codec = "scar_codec.cli:main_cli"
mos-scar-native = "scar_native.cli:main_cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "transformers>=5.0.0",
    "wgpu>=0.18.0",
]
webgpu = [
    "wgpu>=0.18.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scar_cache*", "mixture_of_scars*", "scar_codec*", "scar_native*", "scar_field*"]

[tool.setuptools.package-data]
scar_cache = ["webgpu/*.wgsl", "webgpu/app/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
