[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mixture-of-scars"
version = "6.0.0"
description = "Scar Architecture Ecosystem (v6.0 / ScarField v7.0): ScarNativeLM v6.0, PointScarFlow 3D, ScarField v7.0 (1.000 bpw E8 Post-Transformer), Mixture of Scars (MoS up to 72.71B), SCache O(1) & ScarCodec v6.0 (Zero-PyTorch C/SIMD + Zarr + E8 + 3D)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Julio Cesar Reis Filho" }
]
keywords = [
    "llm",
    "kv-cache",
    "mixture-of-experts",
    "moe",
    "mixture-of-scars",
    "transformers",
    "fast-weights",
    "hebbian-learning",
    "pytorch",
    "huggingface"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.22.0",
    "safetensors>=0.4.0",
    "transformers>=4.45.0",
]

[project.scripts]
mos-run = "scar_cache.cli_72b:main"
mos-transcode-sub2bit = "scar_cache.sub2bit_mos:main_cli"
mos-graft = "scar_cache.scar_grafting:main_cli"
mos-store = "scar_cache.cli_scar_store:main"
mos-rebasin = "scar_cache.sinkhorn_rebasin:main_cli"
mos-webgpu = "scar_cache.webgpu_engine:main_cli"
mos-scar-codec = "scar_codec.cli:main_cli"
mos-scar-native = "scar_native.cli:main_cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "transformers>=5.0.0",
    "wgpu>=0.18.0",
]
webgpu = [
    "wgpu>=0.18.0",
]
physics-bench = [
    "blosc2>=4.15.0 ; python_full_version >= '3.11'",
    "imagecodecs>=2026.3.6 ; python_full_version >= '3.11'",
    "pywavelets>=1.9.0 ; python_full_version >= '3.11'",
    "zfpy==1.0.1 ; python_full_version >= '3.11'",
    "zstandard>=0.25.0 ; python_full_version >= '3.11'",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scar_cache*", "mixture_of_scars*", "scar_codec*", "scar_native*", "scar_field*"]

[tool.setuptools.package-data]
scar_cache = ["webgpu/*.wgsl", "webgpu/app/*"]
scar_codec = ["c_kernels.c", "pyproject.standalone.toml"]
scar_native = ["*.wgsl"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
