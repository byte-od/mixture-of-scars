[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mixture-of-scars"
version = "2.4.0"
description = "Mixture of Scars (MoS) & SCache O(1): Sub-2-Bit/INT4+ASVD Weight Compression, Ghost-Jump Speculative Reflex & Constant-Memory Widrow-Hoff KV-Cache Replacement for 0.5B–72B+ LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Julio Cesar Reis Filho" }
]
keywords = [
    "llm",
    "kv-cache",
    "mixture-of-experts",
    "moe",
    "mixture-of-scars",
    "transformers",
    "fast-weights",
    "hebbian-learning",
    "pytorch",
    "huggingface"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.22.0",
    "safetensors>=0.4.0",
    "transformers>=4.45.0",
]

[project.scripts]
mos-run = "scar_cache.cli_72b:main"
mos-transcode-sub2bit = "scar_cache.sub2bit_mos:main_cli"
mos-graft = "scar_cache.scar_grafting:main_cli"
mos-store = "scar_cache.cli_scar_store:main"
mos-rebasin = "scar_cache.sinkhorn_rebasin:main_cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "transformers>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scar_cache*", "mixture_of_scars*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
